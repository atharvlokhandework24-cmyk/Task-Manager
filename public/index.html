<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="task-manager">
    <h1>Task Manager</h1>
    <p class="subtitle">Mark tasks as complete or remove them from your list.</p>

    <section class="task-section" aria-labelledby="task-list-heading">
      <h2 id="task-list-heading">Your Tasks</h2>
      <ul id="task-list" class="task-list">
        <li class="task-item">
          <span>Read a book</span>
          <div class="task-actions">
            <button class="complete-button" type="button">Complete</button>
            <button class="delete-button" type="button">Delete</button>
          </div>
        </li>
        <li class="task-item">
          <span>Take a walk</span>
          <div class="task-actions">
            <button class="complete-button" type="button">Complete</button>
            <button class="delete-button" type="button">Delete</button>
          </div>
        </li>
        <li class="task-item">
          <span>Plan tomorrow</span>
          <div class="task-actions">
            <button class="complete-button" type="button">Complete</button>
            <button class="delete-button" type="button">Delete</button>
          </div>
        </li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
